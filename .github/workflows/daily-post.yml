name: Daily post pipeline

on:
  workflow_dispatch:
    inputs:
      artwork:
        description: Optional artwork ID; leave blank to use the day's scheduled entry
        required: false
        type: string
      enable_posting:
        description: Publish to X after rendering and validation
        required: true
        default: false
        type: boolean
      # The token dance is the part of this workflow that cannot be rehearsed by reading it:
      # it spends a refresh token, stores its replacement through a second credential, and
      # is unforgiving about the order. This input runs that dance and nothing else, so it
      # can be proved on an afternoon rather than discovered at midnight.
      rehearse_tokens:
        description: Refresh and store the rotated token without posting
        required: true
        default: false
        type: boolean
  # schedule:
  #   - cron: "0 15 * * *"

permissions:
  contents: read

jobs:
  render-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTWORK_INPUT: ${{ inputs.artwork }}
      ENABLE_POSTING_INPUT: ${{ inputs.enable_posting }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p5js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --prefix p5js

      - name: Install Chromium and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          cd p5js
          npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test --prefix p5js

      # An X access token lasts two hours, so a nightly job never has a live one and always
      # starts by trading the stored refresh token for a pair. Neither value is printed:
      # both are written to files under the runner's temporary directory, which does not
      # outlive the run, where the workflow log does.
      # Rehearsal only, and first: proves the rotation token may write a secret before a
      # refresh token is spent on finding out. If this credential is wrong, the run stops
      # here with the refresh token untouched; discovering it after the refresh would leave
      # a spent token in storage and a person at a browser.
      - name: Check that the rotation token can write a secret
        if: inputs.rehearse_tokens
        env:
          GH_TOKEN: ${{ secrets.X_TOKEN_ROTATION_PAT }}
        run: |
          gh secret set X_ROTATION_SELF_TEST --repo "$GITHUB_REPOSITORY" --body "ok"
          gh secret delete X_ROTATION_SELF_TEST --repo "$GITHUB_REPOSITORY"

      - name: Refresh the X access token
        if: inputs.enable_posting || inputs.rehearse_tokens
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
        run: |
          npm run x:refresh --prefix p5js -- \
            --access-token-out "$RUNNER_TEMP/x-access-token" \
            --refresh-token-out "$RUNNER_TEMP/x-refresh-token"

      # Stored before anything is posted, and deliberately its own step. A refresh spends
      # the token it was given, so the copy in storage is dead the moment the step above
      # succeeds; storing after the post would strand the chain — and cost a person a
      # browser and a re-authorization — every time a post failed.
      - name: Store the rotated refresh token
        if: inputs.enable_posting || inputs.rehearse_tokens
        env:
          GH_TOKEN: ${{ secrets.X_TOKEN_ROTATION_PAT }}
        run: gh secret set X_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/x-refresh-token"

      - name: Render and prepare post
        shell: bash
        env:
          X_POSTING_ENABLED: ${{ inputs.enable_posting }}
        run: |
          arguments=()
          if [[ -n "$ARTWORK_INPUT" ]]; then
            arguments+=(--artwork "$ARTWORK_INPUT")
          fi
          if [[ "$ENABLE_POSTING_INPUT" == "true" ]]; then
            arguments+=(--publish)
            X_OAUTH2_ACCESS_TOKEN="$(cat "$RUNNER_TEMP/x-access-token")"
            export X_OAUTH2_ACCESS_TOKEN
          fi
          npm run pipeline --prefix p5js -- "${arguments[@]}"

      - name: Upload rendered media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-post-media
          path: exports/p5js/
          # A run on a day the schedule does not cover renders nothing and is right not to.
          # Failing here would turn that correct no-op red; a render that was attempted and
          # produced nothing throws inside the pipeline long before this step.
          if-no-files-found: warn
          retention-days: 14
