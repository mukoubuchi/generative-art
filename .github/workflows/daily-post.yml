name: Daily post pipeline

on:
  workflow_dispatch:
    inputs:
      artwork:
        description: Optional artwork ID; leave blank to use the day's scheduled entry
        required: false
        type: string
      enable_posting:
        description: Publish to X after rendering and validation
        required: true
        default: false
        type: boolean
      # The token dance is the part of this workflow that cannot be rehearsed by reading it:
      # it spends a refresh token, stores its replacement through a second credential, and
      # is unforgiving about the order. This input runs that dance and nothing else, so it
      # can be proved on an afternoon rather than discovered at midnight.
      rehearse_tokens:
        description: Refresh and store the rotated token without posting
        required: true
        default: false
        type: boolean
      # The queue notice's own rehearsal: proves the issue-comment channel reaches an
      # inbox months before the first live notice is due, with a marker the nightly
      # dedup deliberately does not read.
      rehearse_queue_notice:
        description: Date (YYYY-MM-DD) whose queue notice to post as a marked rehearsal; leave blank to skip
        required: false
        default: ""
        type: string
  # 15:00 UTC is midnight in Tokyo, which is the zone the schedule file keeps its dates in.
  schedule:
    - cron: "0 15 * * *"

# The repository token writes exactly one thing: comments on the queue-status issue.
# Everything else it could name stays at none, and the X secrets never meet it at all.
permissions:
  contents: read
  issues: write

jobs:
  render-and-prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ARTWORK_INPUT: ${{ inputs.artwork }}
      # A dispatched run posts only when someone ticks the box; a scheduled run is the box
      # already ticked, since posting nightly is the entire reason a schedule exists. The
      # `inputs` context is empty on a schedule event, so reading the flag alone would make
      # the cron a nightly rehearsal that never posts — quietly, and looking green.
      PUBLISH: ${{ github.event_name == 'schedule' || inputs.enable_posting == true }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p5js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --prefix p5js

      - name: Install Chromium and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          cd p5js
          npx playwright install --with-deps chromium

      - name: Run unit tests
        run: npm test --prefix p5js

      # Asked before anything is spent. A refresh consumes the stored token, and storing
      # its replacement is the one step whose failure strands the chain, so a night with
      # nothing scheduled must not run that gamble at all. The answer comes from the same
      # lookup the pipeline itself makes; a manual artwork input is a post by definition.
      - name: Look up the day's entry
        id: today
        shell: bash
        run: |
          if [[ -n "$ARTWORK_INPUT" ]]; then
            echo "artwork=$ARTWORK_INPUT" >> "$GITHUB_OUTPUT"
          else
            echo "artwork=$(node p5js/scripts/scheduled-today.mjs)" >> "$GITHUB_OUTPUT"
          fi

      # An X access token lasts two hours, so a night that posts never has a live one and
      # always starts by trading the stored refresh token for a pair. Neither value is
      # printed: both are written to files under the runner's temporary directory, which
      # does not outlive the run, where the workflow log does.
      # Rehearsal only, and first: proves the rotation token may write a secret before a
      # refresh token is spent on finding out. If this credential is wrong, the run stops
      # here with the refresh token untouched; discovering it after the refresh would leave
      # a spent token in storage and a person at a browser.
      - name: Check that the rotation token can write a secret
        if: inputs.rehearse_tokens
        env:
          GH_TOKEN: ${{ secrets.X_TOKEN_ROTATION_PAT }}
        run: |
          gh secret set X_ROTATION_SELF_TEST --repo "$GITHUB_REPOSITORY" --body "ok"
          gh secret delete X_ROTATION_SELF_TEST --repo "$GITHUB_REPOSITORY"

      # The rehearsal input still refreshes on an empty day, deliberately: rotating the
      # chain on purpose, with nothing riding on it, is what the rehearsal is for.
      - name: Refresh the X access token
        if: (env.PUBLISH == 'true' && steps.today.outputs.artwork != '') || inputs.rehearse_tokens
        env:
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
        run: |
          npm run x:refresh --prefix p5js -- \
            --access-token-out "$RUNNER_TEMP/x-access-token" \
            --refresh-token-out "$RUNNER_TEMP/x-refresh-token"

      # Stored before anything is posted, and deliberately its own step. A refresh spends
      # the token it was given, so the copy in storage is dead the moment the step above
      # succeeds; storing after the post would strand the chain — and cost a person a
      # browser and a re-authorization — every time a post failed.
      - name: Store the rotated refresh token
        if: (env.PUBLISH == 'true' && steps.today.outputs.artwork != '') || inputs.rehearse_tokens
        env:
          GH_TOKEN: ${{ secrets.X_TOKEN_ROTATION_PAT }}
        run: gh secret set X_REFRESH_TOKEN --repo "$GITHUB_REPOSITORY" < "$RUNNER_TEMP/x-refresh-token"

      - name: Render and prepare post
        shell: bash
        env:
          X_POSTING_ENABLED: ${{ env.PUBLISH }}
        run: |
          arguments=()
          if [[ -n "$ARTWORK_INPUT" ]]; then
            arguments+=(--artwork "$ARTWORK_INPUT")
          fi
          if [[ "$PUBLISH" == "true" ]]; then
            arguments+=(--publish)
            # Absent exactly when the refresh was skipped for an empty day; the pipeline
            # then says nothing is scheduled and stops before it would ask for a token.
            if [[ -f "$RUNNER_TEMP/x-access-token" ]]; then
              X_OAUTH2_ACCESS_TOKEN="$(cat "$RUNNER_TEMP/x-access-token")"
              export X_OAUTH2_ACCESS_TOKEN
            fi
          fi
          npm run pipeline --prefix p5js -- "${arguments[@]}"

      - name: Upload rendered media
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: daily-post-media
          path: exports/p5js/
          # A run on a day the schedule does not cover renders nothing and is right not to.
          # Failing here would turn that correct no-op red; a render that was attempted and
          # produced nothing throws inside the pipeline long before this step.
          if-no-files-found: warn
          retention-days: 14

      # After the post, so the count describes the queue as the night leaves it, and on
      # publishing runs only — a rehearsal or a dry run is not a posting night and must
      # not speak for one. It runs on empty nights too, which is where its final word is
      # said, and it still spends nothing there: this step never holds an X credential.
      # A missed reminder is recoverable in a way a missed post is not, so a failure
      # here is not allowed to take the pipeline down with it.
      - name: Report the queue level
        if: env.PUBLISH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: node p5js/scripts/queue-status.mjs

      - name: Rehearse the queue notice
        if: inputs.rehearse_queue_notice != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REHEARSE_DATE: ${{ inputs.rehearse_queue_notice }}
        run: node p5js/scripts/queue-status.mjs --rehearse "$REHEARSE_DATE"
