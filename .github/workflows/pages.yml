name: Gallery site

# The site is generated, so it is built here rather than committed, and building it is what
# catches a broken gallery before anyone is looking at one. It runs on a push to main as well
# as on a pull request, because the checks that need a browser are all in this workflow --
# the unit tests are browser-free by design and say so -- and a check that only happens when
# somebody remembers to ask for it is a check that will one day not happen.
#
# Publishing is a separate decision and stays one. Pages is enabled and the deploy job below
# works, but it is gated on an input, and an input exists only when the workflow is started
# by hand: a push builds the site and checks it without putting anything in front of a
# reader. So committing is never by itself an act of publication.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages after building
        required: true
        default: false
        type: boolean
  push:
    branches:
      - main
    paths:
      - "p5js/**"
      - ".github/workflows/pages.yml"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES"
  pull_request:
    paths:
      - "p5js/**"
      - ".github/workflows/pages.yml"
      - "LICENSE"
      - "THIRD_PARTY_LICENSES"

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p5js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --prefix p5js

      # The gallery needs Chromium to capture thumbnails, but no ffmpeg: a thumbnail is one
      # frame, so nothing here is encoded into a clip.
      #
      # WebKit as well, because Chromium is not what a reader on a phone has. Every browser on
      # iOS is WebKit, and on 2026-08-13 an artwork that Chromium drew perfectly was a blank
      # square there — for want of ever having opened it in the engine the reader uses.
      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit
        working-directory: p5js

      - name: Run unit tests
        run: npm test --prefix p5js

      - name: Check the artworks on a dense display
        run: npm run smoke --prefix p5js

      - name: Check that both engines draw the same pictures
        run: npm run smoke:engines --prefix p5js

      # Builds a site of its own into a temporary directory, so it neither depends on the
      # build below nor stands in for it: what it opens has to be a page a reader gets,
      # and the size a page is fitted to is added to it when it is built.
      - name: Check the gallery on a phone
        run: npm run smoke:phone --prefix p5js

      - name: Build the site
        run: npm run site --prefix p5js -- --clean

      - name: Upload the site as a Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Where the site ended up, so the check below can be pointed at it rather than told it.
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # What a reader gets, as opposed to what was built. Everything above this job measures the
  # site this repository produces, and on 2026-08-13 that turned out not to be the same thing
  # for six hours: the fit for small screens was written, committed, and green on every push,
  # while the site being served was the one from before it, because publishing is a separate
  # decision and nobody had made it. The build was never wrong. It was never the thing anyone
  # was looking at.
  #
  # Note what a green here does and does not say. It says the most recent deployment is
  # correct. It does not say that what is on `main` has been deployed -- that is a different
  # question, publishing is deliberately manual, and this job cannot see it.
  #
  # It runs only when a deployment actually happened. `needs: deploy` is what enforces that,
  # since a skipped job skips what needs it; the condition is repeated for the reader.
  verify-published:
    needs: deploy
    if: inputs.deploy
    runs-on: ubuntu-latest
    # Not the ten minutes the deploy job uses. The check is willing to wait ten minutes on its
    # own account -- that being how long the site says it may be cached for -- so a ten-minute
    # job would be cancelled at the very moment the wait reached its limit, and a cancellation
    # says nothing about why. This has to outlast the wait and everything around it: ten
    # minutes of waiting, a few for Node and Chromium, and a few more for thirty-seven pages.
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: p5js/package-lock.json

      - name: Install JavaScript dependencies
        run: npm ci --prefix p5js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: p5js

      - name: Check the published gallery on a phone
        run: >-
          npm run smoke:phone --prefix p5js --
          --base ${{ needs.deploy.outputs.page_url }}
          --sha ${{ github.sha }}
